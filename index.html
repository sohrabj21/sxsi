<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SXSI</title>
  <meta name="description" content="SXSI. A forthcoming hub for fantasy service robots." />
  <meta name="theme-color" content="#100e0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Outfit:wght@300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #100e0d;
      --ink: #f3ebe3;
      --muted: #a3988c;
      --line: rgba(243, 235, 227, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
    }

    body {
      min-height: 100dvh;
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 300;
      display: grid;
      place-items: center;
      padding: 32px 28px 88px;
    }

    main {
      width: min(720px, 100%);
      text-align: left;
    }

    .mark {
      margin: 0;
      font-family: "Bodoni Moda", "Didot", "Bodoni MT", serif;
      font-weight: 500;
      font-size: clamp(76px, 18vw, 168px);
      letter-spacing: -0.03em;
      line-height: 0.86;
    }

    .soon {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.34em;
      text-transform: uppercase;
    }

    .note {
      margin: 18px 0 0;
      max-width: 28ch;
      color: var(--muted);
      font-family: "Bodoni Moda", Georgia, serif;
      font-style: italic;
      font-size: 22px;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.45;
      text-transform: none;
    }

    .rule {
      width: 48px;
      height: 1px;
      margin: 28px 0 0;
      background: var(--line);
    }

    .inquire {
      position: fixed;
      left: 28px;
      bottom: 24px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-decoration: none;
    }

    .inquire span {
      border-bottom: 1px solid transparent;
    }

    .inquire:hover,
    .inquire:focus-visible {
      color: var(--ink);
    }

    .inquire:hover span,
    .inquire:focus-visible span {
      border-bottom-color: var(--line);
    }

    @media (max-width: 520px) {
      .inquire { left: 28px; right: 28px; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="mark">SXSI</h1>
    <p class="soon">Coming soon</p>
    <p class="note">A forthcoming hub for fantasy service robots.</p>
    <div class="rule" aria-hidden="true"></div>
  </main>
  <a class="inquire" href="mailto:SXSI123@protonmail.com?subject=SXSI%20inquiry">Inquiries <span>SXSI123@protonmail.com</span></a>
</body>
</html>
