<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SXSI</title>
  <meta name="description" content="SXSI" />
  <meta name="theme-color" content="#100e0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=Outfit:wght@300&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f3ebe3;
      --muted: #d8cfc6;
      --line: rgba(243, 235, 227, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #100e0d;
      color: var(--ink);
    }

    body {
      min-height: 100dvh;
      font-family: "Outfit", system-ui, sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    .film {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #100e0d;
      z-index: 0;
    }

    .shade {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(16, 14, 13, 0.18) 0%, rgba(16, 14, 13, 0.05) 42%, rgba(16, 14, 13, 0.55) 100%);
    }

    .inquire {
      position: fixed;
      left: 28px;
      bottom: 24px;
      z-index: 2;
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.06em;
      text-decoration: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    .inquire span { border-bottom: 1px solid transparent; }

    .inquire:hover,
    .inquire:focus-visible { color: var(--ink); }

    .inquire:hover span,
    .inquire:focus-visible span { border-bottom-color: var(--line); }

    .mark {
      position: fixed;
      right: 28px;
      bottom: 18px;
      z-index: 2;
      margin: 0;
      font-family: "Bodoni Moda", "Didot", "Bodoni MT", serif;
      font-weight: 500;
      font-size: clamp(42px, 7vw, 72px);
      letter-spacing: -0.035em;
      line-height: 0.86;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.45);
    }

    .mark em {
      font-style: italic;
      font-weight: 400;
      margin-left: 0.06em;
    }

    .contract {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 2;
      margin: 0;
      max-width: min(52vw, 420px);
      color: var(--muted);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.02em;
      line-height: 1.45;
      text-align: center;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.5);
    }

    .contract button {
      display: inline;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      word-break: break-all;
    }

    .contract button:hover,
    .contract button:focus-visible { color: var(--ink); }

    .contract .hint {
      display: block;
      margin-top: 6px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .sound {
      position: fixed;
      top: 22px;
      right: 28px;
      z-index: 2;
      border: 0;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    .sound:hover,
    .sound:focus-visible { color: var(--ink); }

    .credit {
      position: fixed;
      left: 28px;
      top: 22px;
      z-index: 2;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.45);
    }

    .credit:hover,
    .credit:focus-visible { color: var(--ink); }

    @media (max-width: 720px) {
      .contract {
        left: 28px;
        right: 28px;
        bottom: 92px;
        max-width: none;
        transform: none;
      }
      .mark { right: 20px; bottom: 64px; }
      .inquire { left: 20px; bottom: 20px; }
    }
  </style>
</head>
<body>
  <video class="film" id="film" autoplay muted loop playsinline preload="auto" poster="">
    <source src="https://claudia.gallery/films/escape-velocity/loop.mp4" type="video/mp4" />
  </video>
  <div class="shade" aria-hidden="true"></div>
  <a class="credit" href="https://claudia.gallery/escape-velocity/" target="_blank" rel="noopener">Escape Velocity</a>
  <button class="sound" type="button" id="sound">Sound off</button>
  <p class="contract">
    <button type="button" id="ca" data-address="4rLgnFcuADTS2VD7sGxQjoiajbZjYZ411nF7gm7kpump">4rLgnFcuADTS2VD7sGxQjoiajbZjYZ411nF7gm7kpump</button>
    <span class="hint" id="hint">Solana · tap to copy</span>
  </p>
  <h1 class="mark">SX<em>SI</em></h1>
  <a class="inquire" href="mailto:SXSI123@protonmail.com?subject=SXSI%20inquiry">Inquiries <span>SXSI123@protonmail.com</span></a>
  <script>
    const film = document.getElementById("film");
    const sound = document.getElementById("sound");
    const btn = document.getElementById("ca");
    const hint = document.getElementById("hint");

    const start = () => {
      film.muted = true;
      const play = film.play();
      if (play && play.catch) play.catch(() => {});
    };
    start();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) start();
    });

    sound.addEventListener("click", () => {
      film.muted = !film.muted;
      sound.textContent = film.muted ? "Sound off" : "Sound on";
      if (!film.muted) film.play().catch(() => {});
    });

    btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(btn.dataset.address);
        hint.textContent = "Copied";
      } catch (err) {
        hint.textContent = "Select and copy";
      }
      setTimeout(() => { hint.textContent = "Solana · tap to copy"; }, 1600);
    });
  </script>
</body>
</html>
